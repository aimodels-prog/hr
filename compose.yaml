name: via-hr-system

services:
  object-storage:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${VIA_HR_OBJECT_STORAGE_ACCESS_KEY_ID:?Set VIA_HR_OBJECT_STORAGE_ACCESS_KEY_ID in .env.database}
      MINIO_ROOT_PASSWORD: ${VIA_HR_OBJECT_STORAGE_SECRET_ACCESS_KEY:?Set VIA_HR_OBJECT_STORAGE_SECRET_ACCESS_KEY in .env.database}
    ports:
      - "${VIA_HR_OBJECT_STORAGE_PORT:-59000}:9000"
      - "${VIA_HR_OBJECT_STORAGE_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - via_hr_object_data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VIA_HR_POSTGRES_DB:?Set VIA_HR_POSTGRES_DB in .env.database}
      POSTGRES_USER: ${VIA_HR_POSTGRES_USER:?Set VIA_HR_POSTGRES_USER in .env.database}
      POSTGRES_PASSWORD: ${VIA_HR_POSTGRES_PASSWORD:?Set VIA_HR_POSTGRES_PASSWORD in .env.database}
    ports:
      - "${VIA_HR_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - via_hr_postgres_data:/var/lib/postgresql/data

volumes:
  via_hr_postgres_data:
  via_hr_object_data:
